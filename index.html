<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#0f172a">
  <title>EvoTech AI — منصة الصيانة والبرمجة الهندسية المتكاملة</title>
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a12;
      --card-bg: #0f172a;
      --panel-bg: #1e293b;
      --border: #26334d;
      --accent: #38bdf8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --crit: #ef4444;
      --warn: #f59e0b;
      --succ: #10b981;
      --yt-red: #ff0000;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-block { display: flex; align-items: center; gap: 8px; }
    .brand-icon { font-size: 1.3rem; background: rgba(56, 189, 248, 0.1); padding: 5px 8px; border-radius: 8px; border: 1px solid rgba(56,189,248,0.2); }
    .brand-text h1 { font-size: 1.05rem; font-weight: 900; color: var(--accent); }
    .brand-text span { font-size: 0.68rem; color: var(--text-muted); display: block; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .net-badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 20px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .net-online { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .net-offline { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* Navigation Bar */
    nav {
      background: #080d1a;
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      padding: 6px 8px;
      gap: 6px;
      scrollbar-width: none;
      position: sticky;
      top: 53px;
      z-index: 90;
    }
    nav::-webkit-scrollbar { display: none; }
    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .nav-btn.active {
      background: var(--card-bg);
      border-color: var(--border);
      color: var(--accent);
    }

    /* Main Container */
    main { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 14px; max-width: 1100px; margin: 0 auto; width: 100%; }
    .tab-section { display: none; flex-direction: column; gap: 12px; width: 100%; }
    .tab-section.active { display: flex; }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .card-title { font-size: 0.95rem; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 6px; }

    .grid-fluid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; width: 100%; }

    .field-group { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .field-label { font-size: 0.74rem; color: var(--text-muted); font-weight: 700; }
    .field-input, .field-select {
      background: #080d1a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      width: 100%;
      transition: border 0.2s;
    }
    .field-input:focus, .field-select:focus { border-color: var(--accent); }

    .btn {
      background: var(--primary);
      border: none;
      color: #fff;
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
      min-height: 44px;
    }
    .btn:hover { background: var(--primary-hover); }

    /* Accordion / Foldable UI */
    .accordion-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .acc-item {
      background: #080d1a;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .acc-header {
      background: rgba(255,255,255,0.02);
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 800;
      color: #cbd5e1;
      user-select: none;
    }
    .acc-header:hover { background: rgba(56, 189, 248, 0.05); color: var(--accent); }
    .acc-content {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      font-size: 0.84rem;
      line-height: 1.65;
      display: none;
      background: #060913;
    }
    .acc-item.open .acc-content { display: block; }
    .acc-item.open .acc-arrow { transform: rotate(180deg); color: var(--accent); }
    .acc-arrow { transition: transform 0.2s ease; font-size: 0.75rem; color: var(--text-muted); }

    /* Direct Video Launcher Cards (100% Reliable - No Iframe Errors) */
    .video-launch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .video-launch-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      transition: all 0.2s;
    }
    .video-launch-card:hover {
      border-color: var(--yt-red);
      background: #171f38;
      transform: translateY(-2px);
    }
    .video-card-top { display: flex; align-items: flex-start; gap: 8px; }
    .yt-icon-badge {
      background: rgba(255, 0, 0, 0.15);
      color: var(--yt-red);
      font-size: 1.2rem;
      padding: 6px;
      border-radius: 6px;
      line-height: 1;
    }
    .video-card-title { font-size: 0.84rem; font-weight: 800; color: #f8fafc; }
    .video-card-desc { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .video-action-btn {
      background: var(--yt-red);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 800;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Visual Image & Schematic Cards */
    .visual-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .visual-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-decoration: none;
      color: #fff;
      transition: 0.2s;
    }
    .visual-card:hover { border-color: var(--accent); background: #131d33; }
    .visual-header { display: flex; align-items: center; justify-content: space-between; }
    .visual-title { font-size: 0.82rem; font-weight: 800; color: var(--accent); }
    .visual-desc { font-size: 0.72rem; color: var(--text-muted); }

    /* Interactive SVG Test Point Simulation */
    .svg-canvas {
      width: 100%;
      height: 180px;
      background: #040711;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 8px;
    }

    /* Results Card */
    .res-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .res-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.76rem; color: var(--text-muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .res-badge { background: rgba(56,189,248,0.1); color: var(--accent); border: 1px solid rgba(56,189,248,0.2); padding: 3px 8px; border-radius: 6px; font-weight: 700; }

    @media (max-width: 600px) {
      header { padding: 8px 10px; }
      main { padding: 8px; }
      .card { padding: 10px; }
      .nav-btn { font-size: 0.74rem; padding: 6px 10px; }
      .field-input, .field-select, .btn { font-size: 0.84rem; }
    }
  </style>
</head>
<body>

  <!-- Top System Header -->
  <header>
    <div class="brand-block">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <h1>EvoTech AI</h1>
        <span>الهندسة المتقدمة لصيانة وبرمجة الهواتف</span>
      </div>
    </div>
    <div class="header-actions">
      <div id="net-status" class="net-badge net-online">
        <span>●</span> متصل
      </div>
    </div>
  </header>

  <!-- Module Navigation Tabs -->
  <nav>
    <button class="nav-btn active" onclick="switchTab('tab-ai-diag')">🔍 البحث الشامل والموديل</button>
    <button class="nav-btn" onclick="switchTab('tab-dc-analyzer')">⚡ محلل سحب الباور</button>
    <button class="nav-btn" onclick="switchTab('tab-firmware-safety')">🛡️ حاسبة الباينري</button>
  </nav>

  <!-- Main Work Area -->
  <main>

    <!-- TAB 1: AI FULL MODEL SEARCH, VIDEOS & SCHEMATICS -->
    <section id="tab-ai-diag" class="tab-section active">
      <div class="card">
        <div class="card-header">
          <div class="card-title">🔍 البحث الفني الشامل (الفيديوهات والصور والمخططات المباشرة)</div>
          <span style="font-size:0.72rem; color:var(--accent);">دليل مرئي + برمجة + هاردوير</span>
        </div>

        <div class="grid-fluid">
          <div class="field-group">
            <label class="field-label">موديل الجهاز الدقيق (Model Code):</label>
            <input type="text" id="ai-model" class="field-input" placeholder="مثال: SM-A125F أو Redmi Note 10 أو iPhone 11" />
          </div>
          <div class="field-group">
            <label class="field-label">العطل المشتكى منه أو المطلوب تشخيصه:</label>
            <input type="text" id="ai-fault" class="field-input" placeholder="مثال: فاصل باور، شحن، تعريب، أو تخطي FRP" />
          </div>
        </div>

        <button class="btn" id="btn-run-ai" onclick="executeFullModelSearch()">
          ⚡ استخراج التقرير الفني الشامل مع الفيديوهات والصور
        </button>
      </div>

      <!-- Live Stream Results -->
      <div id="ai-stream-results" style="display:flex; flex-direction:column; gap:12px;"></div>
    </section>

    <!-- TAB 2: DC POWER SUPPLY ANALYZER -->
    <section id="tab-dc-analyzer" class="tab-section">
      <div class="card">
        <div class="card-header">
          <div class="card-title">⚡ محلل سحب تيار الباور سبلاي (DC Analyzer)</div>
          <span style="font-size:0.75rem; color:var(--succ);">متاح 100% بدون إنترنت</span>
        </div>

        <div class="grid-fluid">
          <div class="field-group">
            <label class="field-label">مرحلة الفحص:</label>
            <select id="dc-stage-select" class="field-select" onchange="runDCAnalysis()">
              <option value="standby">1. قبل الضغط على زر الباور (Standby Connect)</option>
              <option value="trigger" selected>2. عند الضغط والتحرير (Power Trigger)</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">قيمة السحب المستقرة (بالمللي أمبير mA):</label>
            <input type="number" id="dc-single-val" class="field-input" value="80" step="5" oninput="runDCAnalysis()" />
          </div>
        </div>

        <div id="dc-report-box" style="background:#080d1a; border:1px solid var(--border); border-right:4px solid var(--accent); padding:12px; border-radius:8px; font-size:0.86rem; line-height:1.6;">
        </div>
      </div>
    </section>

    <!-- TAB 3: SAMSUNG & ANDROID BINARY CHECKER -->
    <section id="tab-firmware-safety" class="tab-section">
      <div class="card">
        <div class="card-header">
          <div class="card-title">🛡️ حاسبة حماية الباينري (SW REV Protection)</div>
          <span style="font-size:0.75rem; color:var(--succ);">Offline Ready</span>
        </div>

        <div class="grid-fluid">
          <div class="field-group">
            <label class="field-label">باينري الجهاز الحالي (Current Binary):</label>
            <input type="number" id="sec-current-bin" class="field-input" value="3" min="0" max="20" oninput="runBinaryCheck()" />
          </div>
          <div class="field-group">
            <label class="field-label">اسم ملف الفلاشة المراد تفليشها (Target AP):</label>
            <input type="text" id="sec-target-file" class="field-input" value="A125FXXU3CVL1" oninput="runBinaryCheck()" />
          </div>
        </div>

        <div id="binary-eval-box" style="background:#080d1a; border:1px solid var(--border); border-right:4px solid var(--accent); padding:12px; border-radius:8px; font-size:0.86rem; line-height:1.6;">
        </div>
      </div>
    </section>

  </main>

  <script>
    // Tab Router
    function switchTab(tabId) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
      const targetBtn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick')?.includes(tabId));
      if (targetBtn) targetBtn.classList.add('active');
      const targetSec = document.getElementById(tabId);
      if (targetSec) targetSec.classList.add('active');
    }

    // Toggle Accordion Items
    function toggleAcc(el) {
      const parent = el.parentElement;
      parent.classList.toggle('open');
    }

    // Execute Comprehensive Model Search
    async function executeFullModelSearch() {
      const model = document.getElementById('ai-model').value.trim();
      const fault = document.getElementById('ai-fault').value.trim();
      const btn = document.getElementById('btn-run-ai');
      const resultsContainer = document.getElementById('ai-stream-results');

      if (!model) {
        alert('يرجى كتابة موديل الجهاز للبحث (مثال: SM-A125F)');
        return;
      }

      btn.disabled = true;
      btn.innerText = '⏳ جارٍ استخراج التقرير الفني والوسائط المرئية...';

      try {
        const response = await fetch('/api/diagnose', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            context: { model_code: model },
            text: `الموديل: ${model}. العطل أو المطلوب: ${fault || 'فحص كامل ودليل شامل للموديل'}`
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'خطأ في استجابة الخادم');

        let rawContent = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawContent) throw new Error('لم يتم استلام نص صالح.');

        rawContent = rawContent.replace(/```json/gi, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(rawContent);

        renderFullReport(parsed, resultsContainer);

      } catch (err) {
        alert('حدث خطأ أثناء الفحص: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '⚡ استخراج التقرير الفني الشامل مع الفيديوهات والصور';
      }
    }

    function renderFullReport(res, container) {
      const card = document.createElement('div');
      card.className = 'res-card';

      const modelRaw = res.model_code || res.model || 'Device';
      const mQ = encodeURIComponent(modelRaw);

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
          <h2 style="font-size:1.15rem; font-weight:900; color:var(--accent);">
            ${res.brand || ''} ${res.model || ''} (${modelRaw})
          </h2>
          <span class="res-badge">${res.chipset || 'المعالج غير محدد'}</span>
        </div>

        <div class="res-meta">
          <span>⚙️ التقرير الفني الميداني المعتمد</span>
          <span>📅 ${new Date().toLocaleDateString('ar-YE')}</span>
        </div>

        <div style="font-size:0.88rem; line-height:1.6; background:#080d1a; padding:12px; border-radius:8px; border-right:4px solid var(--accent);">
          <strong>ملخص التشخيص الميداني:</strong><br>
          ${res.diagnostic_summary || 'تم استخراج بيانات الموديل بنجاح.'}
        </div>

        <!-- Accordions -->
        <div class="accordion-group">

          <!-- 1. Direct Video Guides (100% Reliable Playback) -->
          <div class="acc-item open">
            <div class="acc-header" onclick="toggleAcc(this)">
              <span>🎥 1. شروحات الفيديو العملية المباشرة (Direct Video Walkthroughs)</span>
              <span class="acc-arrow">▼</span>
            </div>
            <div class="acc-content">
              <p style="font-size:0.76rem; color:var(--text-muted); margin-bottom:8px;">
                لتفادي حظر التضمين وظهور رسالة "الفيديو غير متوفر"، اضغط لمشاهدة أدق شروحات هذا الموديل مباشرة بجودة عالية:
              </p>
              <div class="video-launch-grid">
                <a href="https://www.youtube.com/results?search_query=${mQ}+teardown+disassembly" target="_blank" rel="noopener noreferrer" class="video-launch-card">
                  <div class="video-card-top">
                    <div class="yt-icon-badge">▶</div>
                    <div>
                      <div class="video-card-title">فيديو فك وتركيب الشاشة والبوردة</div>
                      <div class="video-card-desc">خطوات رفع الغطاء وعزل الفلاتات</div>
                    </div>
                  </div>
                  <div class="video-action-btn">مشاهدة الشرح على YouTube ↗</div>
                </a>

                <a href="https://www.youtube.com/results?search_query=${mQ}+frp+bypass" target="_blank" rel="noopener noreferrer" class="video-launch-card">
                  <div class="video-card-top">
                    <div class="yt-icon-badge">▶</div>
                    <div>
                      <div class="video-card-title">فيديو تخطي حساب جوجل (FRP)</div>
                      <div class="video-card-desc">أحدث ثغرات التخطي لـ ${modelRaw}</div>
                    </div>
                  </div>
                  <div class="video-action-btn">مشاهدة ثغرة التخطي ↗</div>
                </a>

                <a href="https://www.youtube.com/results?search_query=${mQ}+no+power+charging+repair" target="_blank" rel="noopener noreferrer" class="video-launch-card">
                  <div class="video-card-top">
                    <div class="yt-icon-badge">▶</div>
                    <div>
                      <div class="video-card-title">فيديو صيانة الباور والشحن</div>
                      <div class="video-card-desc">تتبع مسارات VBUS وخطوط الإقلاع</div>
                    </div>
                  </div>
                  <div class="video-action-btn">مشاهدة تتبع الأعطال ↗</div>
                </a>

                <a href="https://www.youtube.com/results?search_query=${mQ}+test+point+edl+9008" target="_blank" rel="noopener noreferrer" class="video-launch-card">
                  <div class="video-card-top">
                    <div class="yt-icon-badge">▶</div>
                    <div>
                      <div class="video-card-title">فيديو نقاط التيست بوينت (EDL)</div>
                      <div class="video-card-desc">طريقة توصيل نقاط الطوارئ 9008</div>
                    </div>
                  </div>
                  <div class="video-action-btn">مشاهدة التيست بوينت ↗</div>
                </a>
              </div>
            </div>
          </div>

          <!-- 2. Visual Schematics & Test Points Photo Gallery -->
          <div class="acc-item open">
            <div class="acc-header" onclick="toggleAcc(this)">
              <span>🖼️ 2. معرض صور البوردة ومخططات التيست بوينت المباشرة (Hardware Photos)</span>
              <span class="acc-arrow">▼</span>
            </div>
            <div class="acc-content">
              <p style="font-size:0.76rem; color:var(--text-muted); margin-bottom:8px;">
                اضغط لمعاينة صور ومخططات البوردة المادية ونقاط التيست بوينت عالية الدقة بدون حجب:
              </p>
              <div class="visual-gallery-grid">
                <a href="https://www.google.com/search?tbm=isch&q=${mQ}+test+point+edl+9008" target="_blank" rel="noopener noreferrer" class="visual-card">
                  <div class="visual-header">
                    <span class="visual-title">📍 صور نقاط Test Point 9008</span>
                    <span>↗</span>
                  </div>
                  <span class="visual-desc">معاينة صور أماكن تلامس البوت للـ ${modelRaw}</span>
                </a>

                <a href="https://www.google.com/search?tbm=isch&q=${mQ}+schematic+diagram+pcb+layout" target="_blank" rel="noopener noreferrer" class="visual-card">
                  <div class="visual-header">

    // DC Power Analysis Logic
    function runDCAnalysis() {
      const stage = document.getElementById('dc-stage-select').value;
      const current = parseFloat(document.getElementById('dc-single-val').value) || 0;
      const box = document.getElementById('dc-report-box');

      if (stage === 'standby') {
        if (current === 0) {
          box.style.borderRightColor = 'var(--succ)';
          box.innerHTML = `<strong>سليم تماماً (0.000A):</strong> لا يوجد أي شورت مباشر على خط VBAT / VPH_PWR قبل الضغط على الباور.`;
        } else if (current > 400) {
          box.style.borderRightColor = 'var(--crit)';
          box.innerHTML = `<strong style="color:var(--crit)">شورت صريح ومباشر (>0.4A):</strong> شورت في مكثف رئيسي على مسار VBAT، أو تلف في آيسي الشحن/الباور الرئيسي أو مضخم الصوت. افحص بالحقن الحراري عند 3.7V.`;
        } else {
          box.style.borderRightColor = 'var(--warn)';
          box.innerHTML = `<strong style="color:var(--warn)">تسريب غير طبيعي (${current}mA):</strong> تسريب على مسار التغذية الرئيسي ناتج عن رطوبة أو مكثف تالف جزئياً.`;
        }
      } else {
        if (current === 0) {
          box.style.borderRightColor = 'var(--crit)';
          box.innerHTML = `<strong style="color:var(--crit)">فصل كامل (0mA):</strong> زر الباور مقطوع، أو عدم وصول فولت 1.8V لمفتاح التشغيل من الـ PMIC.`;
        } else if (current >= 20 && current <= 45) {
          box.style.borderRightColor = 'var(--warn)';
          box.innerHTML = `<strong style="color:var(--warn)">سحب ضعيف وثبات (20-45mA):</strong> خلل في كريستالة التوقيت 26MHz أو تلف ملفات التغذية الأولية لآيسي الباور LDO.`;
        } else if (current >= 60 && current <= 95) {
          box.style.borderRightColor = 'var(--accent)';
          box.innerHTML = `<strong style="color:var(--accent)">تعليق اتصال الذاكرة (60-95mA Bootloop):</strong> المعالج يستجيب ولكنه عاجز عن قراءة الذاكرة (UFS / eMMC). تلف منطقة البوت أو فصل في كرات لحام الذاكرة (Reball required).`;
        } else {
          box.style.borderRightColor = 'var(--succ)';
          box.innerHTML = `<strong style="color:var(--succ)">سحب إقلاع طبيعي:</strong> تأرجح بين 0.2A إلى 1.0A يدل على إقلاع النظام بنجاح.`;
        }
      }
    }

    // Binary Safety Logic
    function runBinaryCheck() {
      const cur = parseInt(document.getElementById('sec-current-bin').value) || 0;
      const targetStr = document.getElementById('sec-target-file').value.trim();
      const evalBox = document.getElementById('binary-eval-box');

      const match = targetStr.match(/([A-Z0-9]{4})([0-9])([A-Z0-9]{3,4})$/i);
      let targetBinary = null;
      if (match && match[2]) targetBinary = parseInt(match[2]);

      if (targetBinary === null || isNaN(targetBinary)) {
        evalBox.innerHTML = `⚠️ يرجى التأكد من إدخال اسم فلاشة AP الرسمية الكامل لاستخراج الباينري.`;
        return;
      }

      if (targetBinary >= cur) {
        evalBox.style.borderRightColor = 'var(--succ)';
        evalBox.innerHTML = `<strong style="color:var(--succ)">تفليش آمن ومسموح:</strong> باينري الفلاشة (<strong>${targetBinary}</strong>) متوافق مع باينري الجهاز (<strong>${cur}</strong>). لن يحدث قفل SW REV.`;
      } else {
        evalBox.style.borderRightColor = 'var(--crit)';
        evalBox.innerHTML = `<strong style="color:var(--crit)">⛔ خطر داهم (Downgrade Brick):</strong> باينري الفلاشة (<strong>${targetBinary}</strong>) أقل من باينري الجهاز (<strong>${cur}</strong>)! سيقفل الجهاز بخطأ SW REV CHECK FAIL.`;
      }
    }

    // Startup
    window.addEventListener('DOMContentLoaded', () => {
      runDCAnalysis();
      runBinaryCheck();
    });
  </script>
