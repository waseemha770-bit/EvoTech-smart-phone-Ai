<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#0f172a">
  <title>EvoTech AI — محطة الصيانة والبرمجة الهندسية</title>
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a12;
      --card-bg: #0f172a;
      --panel-bg: #1e293b;
      --border: #26334d;
      --accent: #38bdf8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --crit: #ef4444;
      --warn: #f59e0b;
      --succ: #10b981;
      --yt-red: #ff0000;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-block { display: flex; align-items: center; gap: 8px; }
    .brand-icon { font-size: 1.3rem; background: rgba(56, 189, 248, 0.1); padding: 5px 8px; border-radius: 8px; border: 1px solid rgba(56,189,248,0.2); }
    .brand-text h1 { font-size: 1.05rem; font-weight: 900; color: var(--accent); }
    .brand-text span { font-size: 0.68rem; color: var(--text-muted); display: block; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .net-badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 20px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .net-online { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

    nav {
      background: #080d1a;
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      padding: 6px 8px;
      gap: 6px;
      scrollbar-width: none;
      position: sticky;
      top: 53px;
      z-index: 90;
    }
    nav::-webkit-scrollbar { display: none; }
    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .nav-btn.active {
      background: var(--card-bg);
      border-color: var(--border);
      color: var(--accent);
    }

    main { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 14px; max-width: 1000px; margin: 0 auto; width: 100%; }
    .tab-section { display: none; flex-direction: column; gap: 12px; width: 100%; }
    .tab-section.active { display: flex; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .card-title { font-size: 0.95rem; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 6px; }

    .grid-fluid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; width: 100%; }

    .field-group { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .field-label { font-size: 0.74rem; color: var(--text-muted); font-weight: 700; }
    .field-input, .field-select {
      background: #080d1a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      width: 100%;
      transition: border 0.2s;
    }
    .field-input:focus, .field-select:focus { border-color: var(--accent); }

    .btn {
      background: var(--primary);
      border: none;
      color: #fff;
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
      min-height: 44px;
    }
    .btn:hover { background: var(--primary-hover); }

    /* Results Card */
    .res-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .res-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.76rem; color: var(--text-muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .res-badge { background: rgba(56,189,248,0.1); color: var(--accent); border: 1px solid rgba(56,189,248,0.2); padding: 3px 8px; border-radius: 6px; font-weight: 700; }

    /* Topic Block */
    .target-block {
      background: #080d1a;
      border: 1px solid var(--border);
      border-right: 4px solid var(--accent);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      line-height: 1.65;
      font-size: 0.86rem;
    }
    .target-block-title { font-size: 0.95rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; }

    /* Dedicated Video Card */
    .single-video-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      transition: 0.2s;
      margin-top: 6px;
    }
    .single-video-card:hover { border-color: var(--yt-red); background: #171f38; }
    .video-info-left { display: flex; align-items: center; gap: 10px; }
    .yt-badge { background: rgba(255,0,0,0.15); color: var(--yt-red); font-size: 1.2rem; padding: 6px 10px; border-radius: 6px; }
    .video-btn { background: var(--yt-red); color: #fff; padding: 7px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 800; white-space: nowrap; }

    /* Single Visual Schematic Link */
    .single-ref-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: #fff;
      margin-top: 6px;
      transition: 0.2s;
    }
    .single-ref-card:hover { border-color: var(--accent); background: #131d33; }

    @media (max-width: 600px) {
      header { padding: 8px 10px; }
      main { padding: 8px; }
      .card { padding: 10px; }
      .nav-btn { font-size: 0.74rem; padding: 6px 10px; }
      .field-input, .field-select, .btn { font-size: 0.84rem; }
      .single-video-card { flex-direction: column; align-items: flex-start; }
      .video-btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-block">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <h1>EvoTech AI</h1>
        <span>محطة الصيانة والبرمجة الهندسية</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="net-badge net-online">
        <span>●</span> متصل
      </div>
    </div>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('tab-ai-diag')">🔍 البحث المخصص والمحدد</button>
    <button class="nav-btn" onclick="switchTab('tab-dc-analyzer')">⚡ محلل سحب الباور</button>
    <button class="nav-btn" onclick="switchTab('tab-firmware-safety')">🛡️ حاسبة الباينري</button>
  </nav>

  <main>

    <!-- TAB 1: TARGETED SEARCH (ONLY WHAT IS SEARCHED FOR) -->
    <section id="tab-ai-diag" class="tab-section active">
      <div class="card">
        <div class="card-header">
          <div class="card-title">🎯 البحث المخصص (إظهار المطلوب فقط بدون حشو)</div>
          <span style="font-size:0.72rem; color:var(--accent);">دقيق ومباشر</span>
        </div>

        <div class="grid-fluid">
          <div class="field-group">
            <label class="field-label">موديل الجهاز (Model Code):</label>
            <input type="text" id="ai-model" class="field-input" placeholder="مثال: SM-A125F أو Redmi Note 10" />
          </div>

          <div class="field-group">
            <label class="field-label">حدد المطلوب بدقة ليظهر وحده:</label>
            <select id="ai-target-topic" class="field-select">
              <option value="auto">⚡ تلقائي (حسب ما أكتبه في خانة التفاصيل أدناه)</option>
              <option value="arabization">🌐 طريقة التعريب وضبط اللغة فقط</option>
              <option value="frp">🔐 طريقة تخطي حساب جوجل FRP فقط</option>
              <option value="boot_modes">📟 طرق الدخول لكافة الأوضاع (Download, Recovery, EDL) فقط</option>
              <option value="network">📶 فك الشفرة وتفعيل الإنترنت والـ 4G فقط</option>
              <option value="disassembly">🛠️ طريقة فك وتركيب الجهاز ومحاذير الفلاتات فقط</option>
              <option value="hardware">⚡ تشخيص عطل هاردوير / باور / شحن / ممانعات فقط</option>
              <option value="schematics">📑 المخططات وصور نقاط التيست بوينت فقط</option>
              <option value="all">📋 تقرير فحص شامل وكامل للموديل</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">تفاصيل إضافية عن العطل أو الطلب (اختياري):</label>
          <input type="text" id="ai-fault-text" class="field-input" placeholder="اكتب ملاحظتك (مثال: تعريب بدون روت، أو سحب 80mA، أو ثغرة FRP)..." />
        </div>

        <button class="btn" id="btn-run-ai" onclick="executePreciseSearch()">
          ⚡ استخراج النتيجة المطلوبة فقط
        </button>
      </div>

      <!-- Result Container -->
      <div id="ai-stream-results" style="display:flex; flex-direction:column; gap:12px;"></div>
    </section>

    <!-- TAB 2: DC ANALYZER -->
    <section id="tab-dc-analyzer" class="tab-section">
      <div class="card">
        <div class="card-header">
          <div class="card-title">⚡ محلل سحب تيار الباور سبلاي</div>
          <span style="font-size:0.75rem; color:var(--succ);">Offline Ready</span>
        </div>
        <div class="grid-fluid">
          <div class="field-group">
            <label class="field-label">مرحلة الفحص:</label>
            <select id="dc-stage-select" class="field-select" onchange="runDCAnalysis()">
              <option value="standby">قبل كبسة الباور</option>
              <option value="trigger" selected>بعد كبسة الباور</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">قيمة السحب (mA):</label>
            <input type="number" id="dc-single-val" class="field-input" value="80" step="5" oninput="runDCAnalysis()" />
          </div>
        </div>
        <div id="dc-report-box" style="background:#080d1a; border:1px solid var(--border); border-right:4px solid var(--accent); padding:12px; border-radius:8px; font-size:0.86rem; line-height:1.6;"></div>
      </div>
    </section>

    <!-- TAB 3: BINARY CHECKER -->
    <section id="tab-firmware-safety" class="tab-section">
      <div class="card">
        <div class="card-header">
          <div class="card-title">🛡️ حاسبة حماية الباينري</div>
          <span style="font-size:0.75rem; color:var(--succ);">Offline Ready</span>
        </div>
        <div class="grid-fluid">
          <div class="field-group">
            <label class="field-label">باينري الجهاز الحالي:</label>
            <input type="number" id="sec-current-bin" class="field-input" value="3" min="0" max="20" oninput="runBinaryCheck()" />
          </div>
          <div class="field-group">
            <label class="field-label">اسم ملف الفلاشة المراد تفليشها:</label>
            <input type="text" id="sec-target-file" class="field-input" value="A125FXXU3CVL1" oninput="runBinaryCheck()" />
          </div>
        </div>
        <div id="binary-eval-box" style="background:#080d1a; border:1px solid var(--border); border-right:4px solid var(--accent); padding:12px; border-radius:8px; font-size:0.86rem; line-height:1.6;"></div>
      </div>
    </section>

  </main>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
      const targetBtn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick')?.includes(tabId));
      if (targetBtn) targetBtn.classList.add('active');
      const targetSec = document.getElementById(tabId);
      if (targetSec) targetSec.classList.add('active');
    }

    // Smart Keyword Detection if set to "auto"
    function detectTopic(text) {
      const t = text.toLowerCase();
      if (t.includes('تعريب') || t.includes('لغة') || t.includes('عربي')) return 'arabization';
      if (t.includes('frp') || t.includes('حساب') || t.includes('جوجل')) return 'frp';
      if (t.includes('وضع') || t.includes('ريكفري') || t.includes('داونلود') || t.includes('fastboot') || t.includes('recovery')) return 'boot_modes';
      if (t.includes('شفرة') || t.includes('شبكة') || t.includes('انترنت') || t.includes('4g') || t.includes('apn') || t.includes('sim')) return 'network';
      if (t.includes('فك') || t.includes('تركيب') || t.includes('شاشة') || t.includes('تفكيك')) return 'disassembly';
      if (t.includes('مخطط') || t.includes('تيست بوينت') || t.includes('test point')) return 'schematics';
      if (t.includes('باور') || t.includes('شحن') || t.includes('سحب') || t.includes('شورت') || t.includes('عطل')) return 'hardware';
      return 'all';
    }

    async function executePreciseSearch() {
      const model = document.getElementById('ai-model').value.trim();
      let topic = document.getElementById('ai-target-topic').value;
      const faultText = document.getElementById('ai-fault-text').value.trim();
      const btn = document.getElementById('btn-run-ai');
      const container = document.getElementById('ai-stream-results');

      if (!model) {
        alert('يرجى كتابة موديل الجهاز أولاً.');
        return;
      }

      if (topic === 'auto') {
        topic = detectTopic(faultText);
      }

      btn.disabled = true;
      btn.innerText = '⏳ جارٍ استخراج النتيجة المحددة بدقة...';

      try {
        const response = await fetch('/api/diagnose', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            context: { model_code: model },
            target_topic: topic,
            text: `الموديل: ${model}. المطلوب حصراً: ${topic}. تفاصيل الفني: ${faultText || 'مباشر'}`
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'خطأ استجابة');

        let raw = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!raw) throw new Error('لا توجد بيانات مستلمة');
        raw = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
        const res = JSON.parse(raw);

        renderPreciseReport(res, topic, container);

      } catch (err) {
        alert('حدث خطأ: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '⚡ استخراج النتيجة المطلوبة فقط';
      }
    }

    function renderPreciseReport(res, topic, container) {
      const card = document.createElement('div');
      card.className = 'res-card';

      const modelRaw = res.model_code || res.model || 'Device';
      const mQ = encodeURIComponent(modelRaw);

      let contentHtml = '';

      // 1. Arabization ONLY
      if (topic === 'arabization' || res.arabization) {
        contentHtml += `
          <div class="target-block">
            <div class="target-block-title">🌐 طريقة التعريب المعتمدة للموديل (${modelRaw})</div>
            <div><strong>الإجراء الفني:</strong><br>${res.arabization?.methods || res.diagnostic_summary}</div>
            <div><strong>الأدوات أو الأوامر:</strong><br><code>${res.arabization?.commands_or_tools || 'SamFW / ADB'}</code></div>
            
            <a href="https://www.youtube.com/results?search_query=${mQ}+arabization+language" target="_blank" class="single-video-card">
              <div class="video-info-left">
                <span class="yt-badge">▶</span>
                <div>
                  <div style="font-weight:800; font-size:0.84rem;">فيديو شرح تعريب ${modelRaw}</div>
                  <div style="font-size:0.72rem; color:var(--text-muted);">مشاهدة خطوات التعريب العملية على YouTube</div>
                </div>
              </div>
              <span class="video-btn">فتح الشرح المباشر ↗</span>
            </a>
          </div>
        `;
      }

      // 2. FRP Bypass ONLY
      if (topic === 'frp' || res.frp_bypass) {
        contentHtml += `
          <div class="target-block" style="border-right-color:var(--warn);">
            <div class="target-block-title">🔐 بروتوكول تخطي حساب جوجل FRP لـ (${modelRaw})</div>
            <div><strong>الطريقة الموصى بها:</strong><br>${res.frp_bypass?.recommended_method || res.diagnostic_summary}</div>
            <div style="color:var(--warn);"><strong>⚠️ محاذير أمان:</strong><br>${res.frp_bypass?.security_warning || 'انتبه من قفل Knox Guard'}</div>
            
            <a href="https://www.youtube.com/results?search_query=${mQ}+frp+bypass" target="_blank" class="single-video-card">
              <div class="video-info-left">
                <span class="yt-badge">▶</span>
                <div>
                  <div style="font-weight:800; font-size:0.84rem;">فيديو ثغرة تخطي FRP لـ ${modelRaw}</div>
                  <div style="font-size:0.72rem; color:var(--text-muted);">مشاهدة تطبيق الثغرة خطوة بخطوة على YouTube</div>
                </div>
              </div>
              <span class="video-btn">فتح الفيديو ↗</span>
            </a>
          </div>
        `;
      }

      // 3. Boot Modes ONLY
      if (topic === 'boot_modes' || res.boot_modes) {
        contentHtml += `
          <div class="target-block">
            <div class="target-block-title">📟 طرق الدخول لكافة أوضاع ${modelRaw}</div>
            <div><strong>وضع الداونلود / فاست بوت:</strong> ${res.boot_modes?.download_odin || 'غير محدد'}</div>
            <div><strong>وضع الريكفري:</strong> ${res.boot_modes?.recovery || 'غير محدد'}</div>
            <div><strong>نقاط التيست بوينت والطوارئ (EDL 9008 / BROM):</strong> ${res.boot_modes?.edl_testpoint || 'غير محدد'}</div>
            <div><strong>الوضع الآمن:</strong> ${res.boot_modes?.safe_mode || 'غير محدد'}</div>
            <div><strong>كود منفذ الدياج والـ USB:</strong> <code>${res.boot_modes?.diag_port_code || '*#0808#'}</code></div>

            <a href="https://www.google.com/search?tbm=isch&q=${mQ}+test+point+edl+9008" target="_blank" class="single-ref-card">
              <div>
                <strong style="color:var(--accent); font-size:0.84rem;">📍 صور نقاط التيست بوينت (Test Point)</strong>
                <div style="font-size:0.72rem; color:var(--text-muted);">معاينة صور أماكن التلامس على البوردة مباشرة</div>
              </div>
              <span style="color:var(--accent);">عرض الصور ↗</span>
            </a>
          </div>
        `;
      }

      // 4. Network Unlock ONLY
      if (topic === 'network' || res.network_and_internet) {
        contentHtml += `
          <div class="target-block">
            <div class="target-block-title">📶 فك الشفرة وتفعيل الإنترنت والـ 4G لـ (${modelRaw})</div>
            <div><strong>فك شفرة الشبكة والـ SIM:</strong><br>${res.network_and_internet?.sim_unlock || 'غير محدد'}</div>
            <div><strong>ضبط وتفعيل الإنترنت والـ APN:</strong><br>${res.network_and_internet?.apn_activation || 'غير محدد'}</div>
            <div><strong>توجيهات ملفات الشبكة (Diag / QCN):</strong><br>${res.network_and_internet?.diag_configuration || 'لا يتطلب'}</div>

            <a href="https://www.youtube.com/results?search_query=${mQ}+unlock+network+apn" target="_blank" class="single-video-card">
              <div class="video-info-left">
                <span class="yt-badge">▶</span>
                <div>
                  <div style="font-weight:800; font-size:0.84rem;">فيديو فك الشفرة والـ 4G لـ ${modelRaw}</div>
                  <div style="font-size:0.72rem; color:var(--text-muted);">مشاهدة تطبيق فك الشبكة وضبط الـ APN</div>
                </div>
              </div>
              <span class="video-btn">مشاهدة الشرح ↗</span>
            </a>
          </div>
        `;
      }

      // 5. Disassembly ONLY
      if (topic === 'disassembly' || res.disassembly_guide) {
        contentHtml += `
          <div class="target-block" style="border-right-color:var(--crit);">
            <div class="target-block-title">🛠️ دليل فك وتركيب (${modelRaw})</div>
            <div><strong>حرارة السخان والمدة:</strong> ${res.disassembly_guide?.heat_temp_and_time || '80°C'}</div>
            <div style="color:var(--crit);"><strong>⚠️ محاذير قاتلة (تجنب قطع الفلاتات):</strong><br>${res.disassembly_guide?.critical_precautions || 'انتبه لفلاتة البصمة والشاشة'}</div>
            <div><strong>خطوات الفك بالتسلسل:</strong><br>${res.disassembly_guide?.step_by_step || ''}</div>

            <a href="https://www.youtube.com/results?search_query=${mQ}+teardown+disassembly" target="_blank" class="single-video-card">
              <div class="video-info-left">
                <span class="yt-badge">▶</span>
                <div>
                  <div style="font-weight:800; font-size:0.84rem;">فيديو فك وتفكيك ${modelRaw} بالتفصيل</div>
                  <div style="font-size:0.72rem; color:var(--text-muted);">مشاهدة عملية فتح الجهاز وعزل الشاشة والبطارية</div>
                </div>
              </div>
              <span class="video-btn">فتح الفيديو ↗</span>
            </a>
          </div>
        `;
      }

      // 6. Hardware Fault ONLY
      if (topic === 'hardware' || res.hardware_diagnosis) {
        contentHtml += `
          <div class="target-block">
            <div class="target-block-title">⚡ تشخيص العطل الهاردوير والممانعات لـ (${modelRaw})</div>
            <div><strong>تحليل سحب الباور:</strong><br>${res.hardware_diagnosis?.boot_current_analysis || 'سحب محدد'}</div>
            <div><strong>ممانعات القياس المتوقعة:</strong><br>${res.hardware_diagnosis?.diode_readings || 'افحص على وضع الديود'}</div>
            <div><strong>مسارات التغذية والحل:</strong><br>${res.hardware_diagnosis?.solution_steps || res.diagnostic_summary}</div>

            <a href="https://www.youtube.com/results?search_query=${mQ}+repair+charging+power" target="_blank" class="single-video-card">
              <div class="video-info-left">
                <span class="yt-badge">▶</span>
                <div>
                  <div style="font-weight:800; font-size:0.84rem;">فيديو تتبع وصيانة العطل لـ ${modelRaw}</div>
                  <div style="font-size:0.72rem; color:var(--text-muted);">شرح تتبع المسار واللحام العملي على YouTube</div>
                </div>
              </div>
              <span class="video-btn">مشاهدة الفحص ↗</span>
            </a>
          </div>
        `;
      }

      // 7. Schematics ONLY
      if (topic === 'schematics') {
        contentHtml += `
          <div class="target-block">
            <div class="target-block-title">📑 المخططات ونقاط التيست بوينت لـ (${modelRaw})</div>
            <div>ملفات الدياجرام الرسمية ومسارات البوردة متوفرة عبر المصادر المباشرة التالية:</div>
            
            <a href="https://www.google.com/search?q=${mQ}+schematic+diagram+pdf+free" target="_blank" class="single-ref-card">
              <div>
                <strong style="color:var(--accent); font-size:0.84rem;">📄 تحميل مخطط الصيانة (Schematic PDF)</strong>
                <div style="font-size:0.72rem; color:var(--text-muted);">تحميل ملف الدياجرام ومخطط القطع الإلكترونية</div>
              </div>
              <span style="color:var(--accent);">تحميل ↗</span>
            </a>

            <a href="https://www.google.com/search?tbm=isch&q=${mQ}+test+point+edl+9008" target="_blank" class="single-ref-card">
              <div>
                <strong style="color:var(--accent); font-size:0.84rem;">📍 صور نقاط التيست بوينت (EDL Test Points)</strong>
                <div style="font-size:0.72rem; color:var(--text-muted);">صور التلامس لوضع 9008 عالي الدقة</div>
              </div>
              <span style="color:var(--accent);">عرض الصور ↗</span>
            </a>
          </div>
        `;
      }

      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
          <h2 style="font-size:1.15rem; font-weight:900; color:var(--accent);">
            ${res.brand || ''} ${res.model || ''} (${modelRaw})
          </h2>
          <span class="res-badge">${res.chipset || 'المعالج غير محدد'}</span>
        </div>

        <div class="res-meta">
          <span>🎯 النتيجة المحددة لما تم البحث عنه حصراً</span>
          <span>📅 ${new Date().toLocaleDateString('ar-YE')}</span>
        </div>

      `;

      container.prepend(card);
      card.scrollIntoView({ behavior: 'smooth' });
    }

    // DC Power Analysis Logic
    function runDCAnalysis() {
      const stage = document.getElementById('dc-stage-select').value;
      const current = parseFloat(document.getElementById('dc-single-val').value) || 0;
      const box = document.getElementById('dc-report-box');

      if (stage === 'standby') {
        if (current === 0) {
          box.style.borderRightColor = 'var(--succ)';
          box.innerHTML = `<strong>سليم (0.000A):</strong> لا يوجد أي شورت قبل كبسة الباور على خط VBAT.`;
        } else if (current > 400) {
          box.style.borderRightColor = 'var(--crit)';
          box.innerHTML = `<strong style="color:var(--crit)">شورت صريح (>0.4A):</strong> شورت مباشر على خط البطارية أو منظم الشحن. افحص بالحقن الحراري.`;
        } else {
          box.style.borderRightColor = 'var(--warn)';
          box.innerHTML = `<strong style="color:var(--warn)">تسريب تيار (${current}mA):</strong> تسريب على مسار التغذية الرئيسي VPH_PWR.`;
        }
      } else {
        if (current === 0) {
          box.style.borderRightColor = 'var(--crit)';
          box.innerHTML = `<strong style="color:var(--crit)">فصل كامل (0mA):</strong> مسار كبسة الباور مقطوع أو غياب فولت 1.8V من الـ PMIC.`;
        } else if (current >= 20 && current <= 45) {
          box.style.borderRightColor = 'var(--warn)';
          box.innerHTML = `<strong style="color:var(--warn)">سحب ضعيف وثبات (20-45mA):</strong> خلل في كريستالة التوقيت 26MHz أو تغذية LDO.`;
        } else if (current >= 60 && current <= 95) {
          box.style.borderRightColor = 'var(--accent)';
          box.innerHTML = `<strong style="color:var(--accent)">تعليق اتصال الذاكرة (60-95mA Bootloop):</strong> المعالج يستجيب ولكن عاجز عن قراءة الذاكرة (UFS/eMMC).`;
        } else {
          box.style.borderRightColor = 'var(--succ)';
          box.innerHTML = `<strong style="color:var(--succ)">سحب إقلاع طبيعي:</strong> تأرجح بين 0.2A إلى 1.0A يدل على إقلاع النظام.`;
        }
      }
    }

    // Binary Safety Logic
    function runBinaryCheck() {
      const cur = parseInt(document.getElementById('sec-current-bin').value) || 0;
      const targetStr = document.getElementById('sec-target-file').value.trim();
      const evalBox = document.getElementById('binary-eval-box');

      const match = targetStr.match(/([A-Z0-9]{4})([0-9])([A-Z0-9]{3,4})$/i);
      let targetBinary = null;
      if (match && match[2]) targetBinary = parseInt(match[2]);

      if (targetBinary === null || isNaN(targetBinary)) {
        evalBox.innerHTML = `⚠️ يرجى التأكد من إدخال اسم فلاشة AP لاستخراج الباينري.`;
        return;
      }

      if (targetBinary >= cur) {
        evalBox.style.borderRightColor = 'var(--succ)';
        evalBox.innerHTML = `<strong style="color:var(--succ)">تفليش آمن ومسموح:</strong> باينري الفلاشة (${targetBinary}) متوافق مع الجهاز (${cur}).`;
      } else {
        evalBox.style.borderRightColor = 'var(--crit)';
        evalBox.innerHTML = `<strong style="color:var(--crit)">⛔ خطر داهم (Downgrade Brick):</strong> باينري الفلاشة أقل من الجهاز! سيقفل الجهاز بخطأ SW REV.`;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      runDCAnalysis();
      runBinaryCheck();
    });
  </script>
